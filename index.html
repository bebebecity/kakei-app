<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夫婦の家計管理 Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // 【重要】ここにFirebaseで取得したConfigを貼り付けてください
        const firebaseConfig = {
          apiKey: "AIzaSyBDZtgDi6Brun6G_ojfl7YBCj0NWRcBu7g",
          authDomain: "kakeimo.firebaseapp.com",
          projectId: "kakeimo",
          storageBucket: "kakeimo.firebasestorage.app",
          messagingSenderId: "1074277480943",
          appId: "1:1074277480943:web:0f1f7dafba1330389e1e1a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // アプリの状態
        window.appData = { accounts: ['共通口座'], categories: [], logs: {} };

        // ログイン処理
        window.handleLogin = async () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                alert("ログイン失敗: " + e.message);
            }
        };

        // ログアウト処理
        window.handleLogout = () => signOut(auth);

        // 認証状態の監視
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                startSync();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        });

        // リアルタイム同期の開始
        function startSync() {
            onSnapshot(doc(db, "household_data", "main_record"), (docSnap) => {
                if (docSnap.exists()) {
                    window.appData = docSnap.data();
                    refreshUI();
                    renderCalc();
                }
            });
        }

        // クラウドへ保存
        window.saveToCloud = async () => {
            try {
                await setDoc(doc(db, "household_data", "main_record"), window.appData);
                console.log("Cloud Saved");
            } catch (e) {
                console.error("Save Error", e);
            }
        };
    </script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .is-over { background-color: #fef2f2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-24">

    <div id="auth-screen" class="fixed inset-0 bg-indigo-600 z-[100] flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm space-y-6">
            <h2 class="text-2xl font-black text-center text-indigo-600">Family Login</h2>
            <input type="email" id="login-email" placeholder="メールアドレス" class="w-full p-4 bg-slate-100 rounded-2xl outline-none">
            <input type="password" id="login-pass" placeholder="パスワード" class="w-full p-4 bg-slate-100 rounded-2xl outline-none">
            <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg">ログイン</button>
        </div>
    </div>

    <div id="app-screen" class="hidden">
        <header class="bg-indigo-600 text-white p-5 shadow-md flex justify-between items-center">
            <h1 class="text-lg font-bold">家計管理 Cloud</h1>
            <div class="flex items-center gap-2">
                <input type="month" id="month-select" onchange="renderCalc()" class="bg-white/20 text-xs border-none rounded px-2 py-1 text-white outline-none">
                <button onclick="handleLogout()" class="text-xs opacity-70"><i data-lucide="log-out" class="w-4 h-4"></i></button>
            </div>
        </header>

        <main class="max-w-md mx-auto p-4">
            <div id="tab-calc" class="tab-content active space-y-6">
                <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="font-bold text-indigo-600">収入入力</h2>
                        <select id="type-select" onchange="renderCalc()" class="bg-slate-100 px-2 py-1 rounded text-sm outline-none">
                            <option>給与</option><option>賞与</option><option>臨時</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="number" id="inc-h" oninput="liveUpdate()" class="border-b-2 p-1 font-bold outline-none" placeholder="夫収入">
                        <input type="number" id="inc-w" oninput="liveUpdate()" class="border-b-2 p-1 font-bold outline-none" placeholder="妻収入">
                    </div>
                </section>

                <section class="bg-indigo-50 p-5 rounded-2xl border border-indigo-100">
                    <h3 class="text-xs font-bold text-indigo-400 mb-3 uppercase">送金指示</h3>
                    <div id="transfer-list" class="space-y-2 mb-3"></div>
                    <div class="flex justify-between border-t border-indigo-200 pt-3 text-sm font-bold">
                        <span>残金</span><span id="remaining-amount" class="text-indigo-700">¥0</span>
                    </div>
                </section>

                <div id="expense-list" class="space-y-3"></div>
            </div>

            <div id="tab-master" class="tab-content space-y-6">
                <section class="bg-white p-5 rounded-2xl border border-slate-200 space-y-4">
                    <h3 class="font-bold text-indigo-600">設定・マスタ</h3>
                    <input type="text" id="cat-name" class="w-full p-2 bg-slate-50 rounded" placeholder="費目名">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="cat-target" class="p-2 bg-slate-50 rounded" placeholder="目標金額">
                        <select id="cat-account" class="p-2 bg-slate-50 rounded"></select>
                    </div>
                    <button onclick="addCategory()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold">追加</button>
                </section>
                <div id="master-list" class="space-y-2"></div>
            </div>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around p-2 pb-6 z-50">
            <button onclick="switchTab('calc')" class="nav-btn flex flex-col items-center flex-1 text-indigo-600" data-tab="calc"><i data-lucide="calculator"></i><span class="text-[10px]">計算</span></button>
            <button onclick="switchTab('master')" class="nav-btn flex flex-col items-center flex-1 text-slate-400" data-tab="master"><i data-lucide="settings"></i><span class="text-[10px]">設定</span></button>
        </nav>
    </div>

    <script>
        // タブ切り替え
        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            if(id === 'calc') renderCalc(); else renderMaster();
            lucide.createIcons();
        }

        // 入力時の即時反映（クラウド保存も呼ぶ）
        function liveUpdate() {
            const month = document.getElementById('month-select').value;
            const type = document.getElementById('type-select').value;
            const key = `${month}-${type}`;
            if(!window.appData.logs[key]) window.appData.logs[key] = { incH:0, incW:0, exp:{} };
            
            window.appData.logs[key].incH = Number(document.getElementById('inc-h').value);
            window.appData.logs[key].incW = Number(document.getElementById('inc-w').value);
            
            document.querySelectorAll('.exp-input').forEach(input => {
                window.appData.logs[key].exp[input.dataset.name] = Number(input.value);
            });
            
            calculateAll();
            window.saveToCloud(); // 1文字打つごとにクラウドへ
        }

        function calculateAll() {
            // 前回の計算ロジックをここに統合
            // （紙面の都合上、主要な計算と表示のみ記載）
            const remain = (window.appData.logs[key]?.incH || 0) + (window.appData.logs[key]?.incW || 0);
            document.getElementById('remaining-amount').innerText = `¥${remain.toLocaleString()}`;
        }

        function addCategory() {
            const name = document.getElementById('cat-name').value;
            const target = Number(document.getElementById('cat-target').value);
            if(name && target) {
                window.appData.categories.push({ name, target, account: '共通口座', payer: '夫', incomeType: '給与', expType: '変動費' });
                window.saveToCloud();
                renderMaster();
            }
        }
        
        // UIの再描画（同期時に呼ばれる）
        function refreshUI() {
            lucide.createIcons();
        }
        
        function renderCalc() { /* 描画ロジック */ }
        function renderMaster() { /* 描画ロジック */ }
    </script>
</body>
</html>
