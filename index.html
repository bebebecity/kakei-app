<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家計管理アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
        /* 目標超過時のアラートスタイル */
        .is-over { 
            background-color: #fef2f2 !important; 
            border-color: #ef4444 !important; 
            color: #b91c1c !important; 
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-24">

    <header class="bg-indigo-600 text-white p-5 shadow-md flex justify-between items-center">
        <h1 class="text-lg font-bold">家計管理マネージャー</h1>
        <input type="month" id="month-select" onchange="renderCalc()" class="bg-white/20 text-sm border-none rounded px-2 py-1 outline-none text-white">
    </header>

    <main class="max-w-md mx-auto p-4">
        
        <div id="tab-calc" class="tab-content active space-y-6">
            <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-indigo-600">収入入力</h2>
                    <select id="type-select" onchange="renderCalc()" class="bg-slate-100 px-2 py-1 rounded text-sm outline-none">
                        <option value="給与">給与</option>
                        <option value="賞与">賞与</option>
                        <option value="臨時">臨時</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-slate-500 font-bold">夫 収入</label>
                        <input type="number" id="inc-h" oninput="liveCalculate()" class="w-full text-lg font-bold border-b-2 border-slate-200 focus:border-indigo-500 outline-none py-1" placeholder="0">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500 font-bold">妻 収入</label>
                        <input type="number" id="inc-w" oninput="liveCalculate()" class="w-full text-lg font-bold border-b-2 border-slate-200 focus:border-indigo-500 outline-none py-1" placeholder="0">
                    </div>
                </div>
            </section>

            <section class="bg-indigo-50 p-5 rounded-2xl border border-indigo-100">
                <h3 class="text-xs font-bold text-indigo-400 mb-3">送金指示（マスタ設定より自動集計）</h3>
                <div id="transfer-list" class="space-y-2 mb-3">
                    </div>
                <div class="flex justify-between border-t border-indigo-200 pt-3 text-sm font-bold">
                    <span>残金 (収入 - 総支出)</span>
                    <span id="remaining-amount" class="text-indigo-700">¥0</span>
                </div>
            </section>

            <section>
                <h3 class="text-sm font-bold text-slate-600 mb-3">支出実績</h3>
                <div id="expense-list" class="space-y-3">
                    </div>
            </section>

            <div class="flex justify-center mt-8 pb-4">
                <button onclick="manualSave()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-xl font-bold shadow-lg active:scale-95 transition-all flex justify-center items-center gap-2">
                    <i data-lucide="save" class="w-5 h-5"></i> 現在のデータを保存・更新
                </button>
            </div>
        </div>

        <div id="tab-master" class="tab-content space-y-6">
            
            <section class="flex gap-3 mb-2">
                <button onclick="exportData()" class="flex-1 bg-white border border-slate-200 py-3 rounded-xl text-xs font-bold text-slate-600 shadow-sm flex justify-center items-center gap-2 hover:bg-slate-50 transition-colors">
                    <i data-lucide="download" class="w-4 h-4"></i> エクスポート
                </button>
                <label class="flex-1 bg-white border border-slate-200 py-3 rounded-xl text-xs font-bold text-slate-600 shadow-sm flex justify-center items-center gap-2 hover:bg-slate-50 transition-colors cursor-pointer">
                    <i data-lucide="upload" class="w-4 h-4"></i> インポート
                    <input type="file" onchange="importData(event)" class="hidden" accept=".json">
                </label>
            </section>

            <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <h3 class="font-bold text-indigo-600">口座追加</h3>
                <div class="flex gap-2">
                    <input type="text" id="new-account" class="flex-1 bg-slate-50 px-3 py-2 rounded-lg text-sm border border-slate-200 outline-none" placeholder="口座名">
                    <button onclick="addAccount()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-bold">追加</button>
                </div>
                <div id="account-tags" class="flex flex-wrap gap-2 mt-2"></div>
            </section>

            <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <h3 class="font-bold text-indigo-600">費目登録</h3>
                <div class="space-y-3">
                    <input type="text" id="cat-name" class="w-full bg-slate-50 px-3 py-2 rounded-lg text-sm border border-slate-200 outline-none" placeholder="費目名">
                    <div class="grid grid-cols-2 gap-2">
                        <select id="cat-inc-type" class="bg-slate-50 px-3 py-2 rounded-lg text-sm border border-slate-200 outline-none"><option>給与</option><option>賞与</option><option>臨時</option></select>
                        <select id="cat-exp-type" class="bg-slate-50 px-3 py-2 rounded-lg text-sm border border-slate-200 outline-none"><option value="固定費">固定費 (実績不要)</option><option value="変動費">変動費</option></select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="cat-target" class="bg-slate-50 px-3 py-2 rounded-lg text-sm border border-slate-200 outline-none" placeholder="目標金額">
                        <select id="cat-account" class="bg-slate-50 px-3 py-2 rounded-lg text-sm border border-slate-200 outline-none"></select>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 text-sm flex gap-4">
                        <label><input type="radio" name="payer" value="夫" checked> 夫担当</label>
                        <label><input type="radio" name="payer" value="妻"> 妻担当</label>
                    </div>
                    <button onclick="addCategory()" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold text-sm">マスタに登録</button>
                </div>
            </section>

            <section>
                <h3 class="text-sm font-bold text-slate-600 mb-3">登録済み費目マスタ</h3>
                <div id="master-list" class="space-y-2"></div>
            </section>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around p-2 pb-6 z-50">
        <button onclick="switchTab('calc')" class="nav-btn flex flex-col items-center flex-1 text-indigo-600" data-tab="calc">
            <i data-lucide="calculator" class="w-5 h-5 mb-1"></i><span class="text-[10px] font-bold">計算</span>
        </button>
        <button onclick="switchTab('master')" class="nav-btn flex flex-col items-center flex-1 text-slate-400" data-tab="master">
            <i data-lucide="settings" class="w-5 h-5 mb-1"></i><span class="text-[10px] font-bold">設定</span>
        </button>
    </nav>

    <script>
        // --- データ管理 ---
        let appData = JSON.parse(localStorage.getItem('kakei_fixed_db')) || {
            accounts: ['共通口座', '夫口座', '妻口座'],
            categories: [],
            logs: {}
        };

        function saveData() {
            localStorage.setItem('kakei_fixed_db', JSON.stringify(appData));
        }

        // --- 初期化 ---
        window.onload = () => {
            lucide.createIcons();
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            document.getElementById('month-select').value = `${yyyy}-${mm}`;
            
            renderMasterTab();
            renderCalc();
        };

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.dataset.tab === tabId) {
                    btn.classList.add('text-indigo-600');
                    btn.classList.remove('text-slate-400');
                } else {
                    btn.classList.remove('text-indigo-600');
                    btn.classList.add('text-slate-400');
                }
            });

            if (tabId === 'calc') renderCalc();
            if (tabId === 'master') renderMasterTab();
        }

        // --- データのエクスポート / インポート ---
        function exportData() {
            const dataStr = JSON.stringify(appData, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `kakei_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported && imported.categories) {
                        appData = imported;
                        saveData();
                        renderMasterTab();
                        renderCalc();
                        alert("データをインポートしました！");
                    } else {
                        alert("無効なデータファイルです。");
                    }
                } catch (err) {
                    alert("ファイルの読み込みに失敗しました。");
                }
            };
            reader.readAsText(file);
            event.target.value = ""; // 入力リセット
        }

        function manualSave() {
            saveData();
            alert("入力内容を保存・更新しました！\n（※普段の入力時も自動保存されています）");
        }

        // --- マスタ処理 ---
        function addAccount() {
            const val = document.getElementById('new-account').value;
            if (val) {
                appData.accounts.push(val);
                document.getElementById('new-account').value = '';
                saveData();
                renderMasterTab();
            }
        }

        function addCategory() {
            const name = document.getElementById('cat-name').value;
            const target = Number(document.getElementById('cat-target').value);
            
            if (name && target >= 0) {
                appData.categories.push({
                    name: name,
                    incomeType: document.getElementById('cat-inc-type').value,
                    expType: document.getElementById('cat-exp-type').value,
                    target: target,
                    account: document.getElementById('cat-account').value,
                    payer: document.querySelector('input[name="payer"]:checked').value
                });
                document.getElementById('cat-name').value = '';
                document.getElementById('cat-target').value = '';
                saveData();
                renderMasterTab();
                renderCalc(); 
            } else {
                alert("費目名と目標金額を正しく入力してください");
            }
        }

        function deleteCategory(index) {
            appData.categories.splice(index, 1);
            saveData();
            renderMasterTab();
            renderCalc();
        }

        function renderMasterTab() {
            document.getElementById('account-tags').innerHTML = appData.accounts.map(a => 
                `<span class="bg-slate-200 text-slate-700 px-2 py-1 rounded text-xs">${a}</span>`
            ).join('');
            
            document.getElementById('cat-account').innerHTML = appData.accounts.map(a => 
                `<option value="${a}">${a}</option>`
            ).join('');

            const listObj = document.getElementById('master-list');
            listObj.innerHTML = appData.categories.map((c, i) => `
                <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-[10px] bg-slate-100 px-1 rounded">${c.incomeType}/${c.expType}</span>
                            <span class="font-bold text-sm">${c.name}</span>
                        </div>
                        <div class="text-[11px] text-slate-500">
                            目標: ¥${c.target.toLocaleString()} | <span class="text-indigo-500 font-bold">${c.payer}担当 ➔ ${c.account}</span>
                        </div>
                    </div>
                    <button onclick="deleteCategory(${i})" class="p-2 text-slate-400 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // --- 計算処理 ---
        function renderCalc() {
            const month = document.getElementById('month-select').value;
            const type = document.getElementById('type-select').value;
            const key = `${month}-${type}`;

            if (!appData.logs[key]) {
                appData.logs[key] = { incH: 0, incW: 0, exp: {} };
            }
            const log = appData.logs[key];

            document.getElementById('inc-h').value = log.incH || '';
            document.getElementById('inc-w').value = log.incW || '';

            const filteredCats = appData.categories.filter(c => c.incomeType === type);

            const expList = document.getElementById('expense-list');
            expList.innerHTML = filteredCats.map(c => {
                const isFixed = c.expType === "固定費";
                const savedVal = log.exp[c.name] || '';
                
                return `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
                    <div>
                        <div class="text-sm font-bold flex items-center gap-1">
                            <span class="text-[10px] font-normal px-1 rounded ${isFixed ? 'bg-slate-100 text-slate-500' : 'bg-indigo-100 text-indigo-600'}">${c.expType}</span>
                            ${c.name}
                        </div>
                        <div class="text-[11px] text-slate-500 mt-1">
                            目標: ¥${c.target.toLocaleString()} (${c.payer} ➔ ${c.account})
                        </div>
                    </div>
                    ${isFixed 
                        ? `<span class="text-xs font-bold text-slate-400">実績入力不要</span>` 
                        : `<input type="number" 
                                  data-name="${c.name}" 
                                  data-target="${c.target}" 
                                  oninput="liveCalculate()" 
                                  class="exp-input w-24 bg-slate-50 border border-slate-200 rounded px-2 py-2 text-right font-bold outline-none focus:border-indigo-500 transition-colors" 
                                  placeholder="実績" 
                                  value="${savedVal}">`
                    }
                </div>`;
            }).join('');

            liveCalculate();
        }

        function liveCalculate() {
            const month = document.getElementById('month-select').value;
            const type = document.getElementById('type-select').value;
            const key = `${month}-${type}`;

            const incH = Number(document.getElementById('inc-h').value) || 0;
            const incW = Number(document.getElementById('inc-w').value) || 0;
            appData.logs[key].incH = incH;
            appData.logs[key].incW = incW;

            let totalExp = 0;
            const transferMap = {}; 

            const filteredCats = appData.categories.filter(c => c.incomeType === type);

            filteredCats.forEach(c => {
                const routeKey = `${c.payer} ➔ ${c.account}`;
                transferMap[routeKey] = (transferMap[routeKey] || 0) + c.target;
            });

            document.getElementById('transfer-list').innerHTML = Object.entries(transferMap).map(([route, amount]) => `
                <div class="flex justify-between bg-white px-3 py-2 rounded text-xs font-bold border border-indigo-100">
                    <span class="text-slate-600">${route}</span>
                    <span class="text-indigo-600">¥${amount.toLocaleString()}</span>
                </div>
            `).join('') || '<div class="text-xs text-slate-400 text-center py-2">データがありません</div>';

            document.querySelectorAll('.exp-input').forEach(input => {
                const catName = input.dataset.name;
                const target = Number(input.dataset.target);
                const val = Number(input.value) || 0;

                appData.logs[key].exp[catName] = val;

                if (val > target) {
                    input.classList.add('is-over');
                } else {
                    input.classList.remove('is-over');
                }

                totalExp += val;
            });

            filteredCats.filter(c => c.expType === '固定費').forEach(c => {
                totalExp += c.target;
            });

            const remain = (incH + incW) - totalExp;
            const remainEl = document.getElementById('remaining-amount');
            remainEl.innerText = `¥${remain.toLocaleString()}`;
            
            if (remain < 0) {
                remainEl.classList.remove('text-indigo-700');
                remainEl.classList.add('text-red-600');
            } else {
                remainEl.classList.add('text-indigo-700');
                remainEl.classList.remove('text-red-600');
            }

            saveData();
        }
    </script>
</body>
</html>
